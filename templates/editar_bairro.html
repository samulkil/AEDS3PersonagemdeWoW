{% extends "base_wow.html" %}

{% block title %}Editar Bairro - {{usuario}}{% endblock %}

{% block content %}
<h1 class="wow-title">Editar Bairro</h1>

<div style="max-width: 600px; margin: 30px auto;">
    <div class="wow-card wow-card-highlight">
        <div class="wow-card-title">Atualizar Bairro #{{id}}</div>

        <form method="POST" action="/atualizar_bairro">
            <input type="hidden" name="id" value="{{id}}">

            <div class="wow-form-group">
                <label class="wow-label">Nome do Bairro</label>
                <input type="text" name="nome" class="wow-input" value="{{nome}}" required maxlength="30">
            </div>

            <div class="wow-form-group">
                <label class="wow-label">Personagem Dono</label>
                <select name="id_dono" class="wow-input" required>
                    {{opcoes_dono|safe}}
                </select>
            </div>

            <div class="wow-actions" style="justify-content: flex-start; margin-top: 25px;">
                <button type="submit" class="wow-btn wow-btn-success">Salvar Alterações</button>
                <a href="/bairros" class="wow-btn">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
