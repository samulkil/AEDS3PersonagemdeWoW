{% extends "base_wow.html" %}

{% block title %}Criar Conta - World of RPGcraft{% endblock %}

{% block content %}
<h1 class="wow-title"> Criar Nova Conta</h1>

<div style="max-width: 620px; margin: 30px auto;">
    <div class="wow-card wow-card-highlight">
        <div class="wow-card-title"> Registro do Aventureiro</div>

        <form method="POST" action="/salvar_conta">
            <div class="wow-form-group">
                <label class="wow-label">Usuário</label>
                <input name="usuario" class="wow-input" required maxlength="20" placeholder="Nome do aventureiro">
            </div>

            <div class="wow-form-group">
                <label class="wow-label">E-mail</label>
                <input name="email" class="wow-input" required maxlength="30" placeholder="Seu e-mail de contato">
            </div>

            <div class="wow-form-group">
                <label class="wow-label">Data (DD/MM/AAAA)</label>
                <input name="data" class="wow-input" required maxlength="10" placeholder="01/01/2024">
            </div>

            <div class="wow-actions" style="justify-content: flex-start;">
                <button type="submit" class="wow-btn wow-btn-success"> Criar Conta</button>
                <a href="/" class="wow-btn"> Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
