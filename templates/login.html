{% extends "base_wow.html" %}

{% block title %}Entrar no Reino - World of RPGcraft{% endblock %}

{% block content %}
<h1 class="wow-title">Entrar no Reino</h1>

<div style="max-width: 500px; margin: 40px auto;">
    <div class="wow-card">
        <div class="wow-card-title"> Credenciais do Aventureiro</div>
        
        <form method="POST" action="/autenticar">
            <div class="wow-form-group">
                <label class="wow-label">Nome do Herói</label>
                <input type="text" name="usuario" class="wow-input" required
                       placeholder="Seu nome de usuário...">
            </div>

            <div class="wow-form-group">
                <label class="wow-label">Senha Secreta</label>
                <input type="password" name="senha" class="wow-input" required
                       placeholder="Sua senha...">
            </div>

            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <button type="submit" class="wow-btn" style="flex: 1;">
                     Entrar no Mundo
                </button>
                <a href="/" class="wow-btn" style="flex: 1; text-align: center;">
                     Voltar
                </a>
            </div>
        </form>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="/criar_conta" class="wow-link">Novo nestas terras? Crie sua conta!</a>
    </div>
</div>
{% endblock %}
