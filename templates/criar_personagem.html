{% extends "base_wow.html" %}

{% block title %}Invocar Herói - World of RPGcraft{% endblock %}

{% block content %}
<h1 class="wow-title"> Invocar Novo Herói</h1>

<div style="max-width: 600px; margin: 40px auto;">
    <div class="wow-card">
        <div class="wow-card-title"> Ritual de Invocação</div>
        
        <form method="POST" action="/salvar_personagem">
            <div class="wow-form-group">
                <label class="wow-label">Nome do Herói</label>
                <input type="text" name="nome" class="wow-input" required 
                       placeholder="Ex: Arthas, Jaina, Thrall...">
            </div>
            
            <div class="wow-form-group">
                <label class="wow-label">Nível de Poder Inicial</label>
                <input type="number" name="nivel" class="wow-input" 
                       value="1.0" step="0.5" min="1.0" max="100.0">
                <small style="color: #8b7355;">Quanto maior o nível, mais poderoso será</small>
            </div>

            <div class="wow-form-group">
                <label class="wow-label">Função do Herói</label>
                <select name="funcao" class="wow-input" required>
                    <option value="dano">Dano</option>
                    <option value="tanque">Tanque</option>
                    <option value="suporte">Suporte</option>
                </select>
                <small style="color: #8b7355;">Escolha o papel do herói no grupo</small>
            </div>
            
            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <button type="submit" class="wow-btn wow-btn-success" style="flex: 1;">
                 Completar
                </button>
                <a href="/personagens" class="wow-btn" style="flex: 1; text-align: center;">
                     Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
